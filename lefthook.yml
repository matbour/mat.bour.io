# Git hooks, installed by `bun install` (see the "prepare" script).
# Skip once with `LEFTHOOK=0 git commit ...`.

pre-commit:
  commands:
    format:
      # Formats only the staged files and stages them again.
      run: bun fmt --staged

commit-msg:
  commands:
    conventional:
      # Rejects messages that don't follow Conventional Commits (see commitlint.config.js).
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    check:
      # Types and the content schema (front matter of every post).
      run: bun run check
